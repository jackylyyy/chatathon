[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Explains security risk to developers, and stops AI coding agents from writing it in the first place."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # llm.py calls client.messages.parse(output_format=...) and reads
    # ParsedMessage.parsed_output. Both arrived in the 1.x SDK; on 0.40 the
    # guard silently degrades to offline explanations forever.
    "anthropic>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
# Point the type checker at the venv, so editors resolve anthropic/rich/typer
# instead of marking every third-party import as unresolved.
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests"]
typeCheckingMode = "basic"
